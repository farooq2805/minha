name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --org app.minha --project-name minha --platforms android .
          rm -rf test
          python3 scripts/patch_android.py

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk minha-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: minha-apk
          path: minha-${{ github.run_number }}.apk

      - name: Push APK to apk branch
        run: |
          mkdir -p /tmp/apk && cp minha-${{ github.run_number }}.apk /tmp/apk/minha-latest.apk
          git config user.name "minha-ci"
          git config user.email "ci@minha.app"
          git checkout --orphan apk
          git rm -rf . -q
          cp /tmp/apk/minha-latest.apk .
          git add minha-latest.apk
          git commit -m "APK build ${{ github.run_number }}"
          git push -f origin apk

      - name: Publish release for phone download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Minha test build ${{ github.run_number }}
          prerelease: true
          files: minha-${{ github.run_number }}.apk

  emulator-test:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: minha-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/smoke.sh
      - name: Save screenshots and log to ci-shots branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r shots/* /tmp/out/ || true
          git config user.name "minha-ci"
          git config user.email "ci@minha.app"
          git checkout --orphan ci-shots
          git rm -rf . -q
          cp -r /tmp/out/* . || true
          git add -A
          git commit -m "Emulator run ${{ github.run_number }}" || true
          git push -f origin ci-shots
